      </a>

      <nav class="nav-lateral" aria-label="Navegação principal">
        <ul class="nav-lista">

            <a class="nav-link" href="inicio.html">

                <path d="M3 10.8 12 3l9 7.8" />
                <path d="M5.5 9.5V21h13V9.5M9 21v-7h6v7" />
              </svg>
              <span>Início</span>
            </a>
          </li>
          <li>
            <a class="nav-link" href="pesquisar.html">
              <svg class="icone" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="7" />
                <path d="m16.2 16.2 4.3 4.3" />
              </svg>
              <span>Pesquisar</span>

          </li>
          <li>
            <a class="nav-link" href="minha-lista.html">

                <path d="m12 2.8 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-2.9L6.4 20l1.1-6.2L3 9.4l6.2-.9z" />
              </svg>
              <span>Minhas avaliações</span>
            </a>
          </li>
        </ul>
      </nav>

      <figure class="trecho-dia">
        <figcaption class="trecho-rotulo">Trecho do dia</figcaption>
        <blockquote class="trecho-texto">
          <p>“A gente combinamos de não morrer.”</p>
        </blockquote>
        <cite class="trecho-autor">Conceição Evaristo</cite>
      </figure>

      <div class="perfil">
        <span class="avatar avatar-perfil" aria-hidden="true">MW</span>
        <p class="perfil-info">
          <strong class="perfil-nome">Matheus Wilke</strong>
          <small class="perfil-usuario">@wilkematheus</small>
        </p>
        <a class="perfil-sair" href="entrar.html" aria-label="Sair da conta">
          <svg class="icone" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M10 4H5v16h5M14 8l4 4-4 4M8 12h10" />
          </svg>
        </a>
      </div>
    </aside>

    <div class="area-principal">
      <!-- Topo -->
      <header class="topo">
        <p class="topo-titulo">
          <span class="topo-titulo-desktop">Livro</span>
          <a class="topo-logo-mobile" href="inicio.html">resenli.</a>
        </p>

        <div class="topo-acoes">
          <a class="botao-icone" href="pesquisar.html" aria-label="Pesquisar">
            <svg class="icone" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <path d="m16.2 16.2 4.3 4.3" />
            </svg>
          </a>
          <a class="botao botao-primario" href="minhas-avaliacoes.html?nova=1" data-abrir-formulario>
            <svg class="icone" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5v14M5 12h14" />
            </svg>
            Nova resenha
          </a>
          <span class="avatar avatar-perfil avatar-pequeno" aria-hidden="true">MW</span>
        </div>
      </header>

      <main class="conteudo" id="conteudo-livro">
        <a class="link-forte voltar" href="pesquisar.html">← Voltar para a busca</a>

        <!-- Montado por renderizarLivro() em assets/js/livro.js -->
        <section class="livro-pagina" id="livro-pagina" aria-live="polite"></section>

        <section class="livro-sobre" id="livro-sobre" aria-labelledby="titulo-sobre" hidden>
          <h2 id="titulo-sobre" class="titulo-secao">Sobre o livro</h2>
          <p class="livro-sobre-texto" id="livro-sobre-texto"></p>
          <p class="livro-sobre-fonte">
            Descrição do Google Books.
            <a class="link-forte" id="livro-sobre-link" target="_blank" rel="noopener noreferrer" hidden>Ver no Google Books →</a>
          </p>
        </section>

        <section class="livro-resenhas" id="livro-resenhas" aria-labelledby="titulo-resenhas-livro" hidden>
          <header class="cabecalho-secao">
            <div>
              <p class="sobretitulo">Comunidade</p>
              <h2 id="titulo-resenhas-livro" class="titulo-secao">Resenhas</h2>
            </div>
          </header>
          <div id="lista-resenhas-livro"></div>
        </section>
      </main>
    </div>

    <!-- Navegação inferior (celular) -->

      <a class="nav-mobile-link" href="inicio.html">

        <span>Avaliações</span>
      </a>

    <script src="assets/js/utils.js"></script>
    <script src="assets/js/status.js"></script>
    <script src="assets/js/conta.js"></script>
    <script src="assets/js/persistencia.js"></script>
    <script src="assets/js/layout.js"></script>
